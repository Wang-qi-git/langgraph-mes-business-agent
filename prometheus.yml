global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mes-agent'
    static_configs:
      - targets: ['backend:8000']    # Docker 网络内部服务名
    metrics_path: '/metrics'
    scrape_interval: 5s